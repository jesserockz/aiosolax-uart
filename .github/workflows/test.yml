name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Deny by default; each job opts in to exactly what it needs.
permissions: {}

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read  # actions/checkout reads the repository
    strategy:
      fail-fast: false  # finish every Python version so we see exactly which ones break
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
      - name: Run pytest with coverage
        run: uv run --python ${{ matrix.python-version }} pytest --cov=aiosolax_uart --cov-report=xml
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.14'
        # Token requirement disabled on the Codecov side for this repo,
        # so the upload runs unauthenticated and needs no extra
        # GITHUB_TOKEN scopes from this workflow.
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        with:
          files: coverage.xml
          fail_ci_if_error: false

  pre-commit:
    name: Pre-commit hooks
    runs-on: ubuntu-latest
    permissions:
      contents: read  # actions/checkout reads the repository
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
      - name: Run pre-commit on all files
        run: uv run --with pre-commit pre-commit run --all-files --show-diff-on-failure
