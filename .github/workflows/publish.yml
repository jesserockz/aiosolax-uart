name: Publish to PyPI

# Triggers only when a draft release is explicitly published by a maintainer
# via the GitHub UI. The release already carries the immutable dist assets
# (built and attached by the release-drafter workflow at merge time), so
# publishing is a pure pass-through with zero source modifications.
on:
  release:
    types: [published]

# Deny by default; each job opts in to exactly what it needs.
permissions: {}

jobs:
  publish:
    name: Upload release assets to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read    # download the release's pre-built dist assets
      id-token: write   # PyPI Trusted Publishing requires an OIDC token
    steps:
      - name: Download dist from the published release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        # The release's attached dist files are what get published —
        # we don't rebuild here, guaranteeing the artifacts that ship to
        # PyPI are byte-identical to what was reviewed in the draft.
        run: |
          mkdir -p dist
          gh release download "${TAG}" \
            --repo "${{ github.repository }}" \
            --dir dist \
            --pattern '*.tar.gz' \
            --pattern '*.whl'
          ls -la dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b  # v1.14.0
