name: Feature request
description: Suggest a new capability for the library
labels: ["enhancement"]
body:
  - type: textarea
    id: motivation
    attributes:
      label: What problem are you trying to solve?
      description: Describe the use case in your own words before proposing a specific solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed API or behaviour
      description: If you have a concrete shape in mind, sketch it here.
      render: python

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other workarounds you've tried or rejected.
