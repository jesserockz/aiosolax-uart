version: 2
updates:
  # Keep GitHub Actions pinned to the latest commit SHA — dependabot will
  # automatically update the SHA and the trailing version comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"

  # Python dependencies declared in pyproject.toml + uv.lock.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"
